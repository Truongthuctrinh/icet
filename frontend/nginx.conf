server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;            # không lộ phiên bản nginx
    client_max_body_size 3m;      # ảnh tối đa 2 MB + phần đầu của form

    # Header bảo mật (giống vite.config.js khi chạy dev)
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # API: chuyển sang container api. Ghi ĐÈ X-Forwarded-For bằng IP thật
    # (không nối thêm) -> người dùng không giả được IP bằng cách tự gửi header này
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header User-Agent $http_user_agent;
        proxy_read_timeout 60s;
    }

    # robots.txt do backend sinh (danh sách bot AI bị chặn)
    location = /robots.txt {
        proxy_pass http://api:8000;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Ảnh bìa / ảnh đại diện: nginx đọc thẳng từ volume chung, không đi qua Python.
    # Tên file là mã ngẫu nhiên, đổi ảnh = file mới -> cho trình duyệt lưu lâu
    location /media/ {
        alias /srv/media/;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # File build của Vite có mã trong tên -> lưu cache lâu
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # React Router: mọi đường dẫn khác trả về index.html
    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
